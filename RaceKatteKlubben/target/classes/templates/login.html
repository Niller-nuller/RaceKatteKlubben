<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log ind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0c;
      --surface: #141418;
      --border: #232328;
      --border-focus: #4a4a55;
      --text: #e8e8ed;
      --text-muted: #6e6e7a;
      --accent: #c9a55a;
      --accent-hover: #dbb96e;
      --input-bg: #0e0e12;
      --error: #c45c5c;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Subtle ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: -40%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(201, 165, 90, 0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 48px 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      position: relative;
      animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-card h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text);
    }

    .login-card p.subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 36px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field input::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
    }

    .field input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(201, 165, 90, 0.08);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      font-size: 0.8rem;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .options input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--input-bg);
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }

    .options input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .options input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 11px;
      color: #0a0a0c;
      font-weight: 700;
    }

    .options a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .options a:hover {
      color: var(--accent-hover);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      letter-spacing: 0.01em;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:active {
      transform: scale(0.985);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .footer-text {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .footer-text a:hover {
      color: var(--accent-hover);
    }

    @media (max-width: 480px) {
      .login-card {
        margin: 16px;
        padding: 36px 28px;
      }
    }
  </style>
</head>
<body>
<div class="login-card">
  <h1>Log ind</h1>
  <p class="subtitle">Indtast dine oplysninger for at fortsætte</p>

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="din@email.dk" autocomplete="email">
  </div>

  <div class="field">
    <label for="password">Adgangskode</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <div class="options">
    <label>
      <input type="checkbox"> Husk mig
    </label>
    <a href="#">Glemt adgangskode?</a>
  </div>

  <button class="btn" type="button">Log ind</button>

  <div class="divider">eller</div>

  <p class="footer-text">Har du ikke en konto? <a href="#">Opret konto</a></p>
</div>
</body>
</html>
