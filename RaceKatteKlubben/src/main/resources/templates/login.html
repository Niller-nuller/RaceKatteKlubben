<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log ind — Racekatteklubben</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-content">
<div class="card">
    <div class="logo-area">
        <span class="paw-icon">🐾</span>
        <h1>Log ind</h1>
        <p>Log ind på din profil</p>
    </div>

    <div th:if="${error}" class="error-msg">
        <span th:text="${error}">Forkert email eller adgangskode</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="din@email.dk" required>
        </div>

        <div class="field">
            <label for="password">Adgangskode</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button class="btn-primary" type="submit">Log ind</button>
    </form>

    <div class="divider">eller</div>

    <a th:href="@{/register}" class="btn-secondary">Opret konto</a>
</div>
</div>
</body>
</html>
