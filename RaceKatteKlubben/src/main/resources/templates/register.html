<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret konto — Racekatteklubben</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-content">
<div class="card">
    <div class="logo-area">
        <span class="paw-icon">🐾</span>
        <h1>Opret konto</h1>
        <p>Bliv medlem af Racekatteklubben</p>
    </div>

    <form th:action="@{/register}" th:object="${UserLogin}" method="post">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="din@email.dk" required>
        </div>

        <div class="field">
            <label for="password">Adgangskode</label>
            <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required>
        </div>

        <button class="btn-primary" type="submit">Opret konto</button>
    </form>

    <div class="divider">eller</div>

    <a th:href="@{/login}" class="btn-secondary">Log ind</a>
</div>
</div>
</body>
</html>
