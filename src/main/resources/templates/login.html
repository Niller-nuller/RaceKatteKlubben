<!DOCTYPE html>
<html lang="da" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log ind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div>
    <h1>Vær sød at logge ind</h1>
    <form th:action="@{/login}" th:object="${Auth}" method="post">
        <label for="email">Email:</label><br>
        <input type="text" id="email" th:field="*{email}" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" th:field="*{password}" required><br><br>

        <button type="submit">Log ind</button>
        <a href="/register"><button type="button">Register</button></a>
    </form>

</div>
</body>
</html>
