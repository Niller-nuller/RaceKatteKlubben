<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rediger profil — Racekatteklubben</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-content">
    <div class="card">
        <div class="logo-area">
            <span class="paw-icon">🐾</span>
            <h1>Rediger profil</h1>
            <p>Opdater dine oplysninger</p>
        </div>

        <div th:if="${param.success}" class="success-msg">
            Dine oplysninger er opdateret!
        </div>

        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <form th:action="@{/user/edit}" th:object="${editUser}" method="post">

            <div class="field">
                <label for="name">Fornavn</label>
                <input type="text" id="name" th:field="*{name}" required>
            </div>

            <div class="field">
                <label for="lastName">Efternavn</label>
                <input type="text" id="lastName" th:field="*{lastName}" required>
            </div>

            <div class="field">
                <label for="gender">Køn</label>
                <select id="gender" th:field="*{gender}" required>
                    <option value="">-- vælg --</option>
                    <option th:each="g : ${genders}"
                            th:value="${g}"
                            th:text="${g}"></option>
                </select>
            </div>

            <button class="btn-primary" type="submit">Gem ændringer</button>
        </form>

        <a th:href="@{/myprofile}" class="btn-secondary" style="margin-top:12px;">Annuller</a>
    </div>
</div>
</body>
</html>
