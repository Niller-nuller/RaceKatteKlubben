<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cat List</title>
</head>
<body>
<h1>Cat List</h1>
<table>
  <tr th:each="cat : ${catList}">

    <tr th:text="${cat.breedCode}">
    <tr th:text="$"
    <tr th:text="furColorCode">
    <tr th:text="${cat.name}">
    <tr th:text="${cat.gender}">
  </tr>
</table>

<h3><a href=""></a> Tilbage til home</h3>

</body>
</html>
